{% extends 'base.html' %}

{% block title %}Recuperar Contraseña - {{ block.super }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="formulario-autenticacion">
            <h2 class="text-center mb-4">Recuperar Contraseña</h2>
            <p class="text-center mb-4">
                Ingresa tu dirección de correo electrónico y te enviaremos una contraseña temporal.
            </p>
            
            <form method="post" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" name="email" required placeholder="Correo electrónico">
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-3">Enviar contraseña temporal</button>
            </form>
            
            <div class="text-center mt-4">
                <a href="{% url 'login' %}">Volver a Iniciar Sesión</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
