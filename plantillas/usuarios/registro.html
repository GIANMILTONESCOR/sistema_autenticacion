{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Registro - {{ block.super }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="formulario-autenticacion">
            <h2 class="text-center mb-4">Crear una cuenta</h2>
            
            <!-- Formulario de registro manual -->
            <form method="post" novalidate>
                {% csrf_token %}
                {{ formulario|crispy }}
                <button type="submit" class="btn btn-primary w-100 mt-3">Registrarse</button>
            </form>
            
            <!-- Separador -->
            <div class="login-social">
                <span>o registrarse con</span>
            </div>
            
            <!-- Botón de Google -->
            <a href="{% url 'socialaccount_signup' %}" class="boton-google">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google">
                Continuar con Google
            </a>
            
            <!-- Enlace a login -->
            <div class="text-center mt-4">
                ¿Ya tienes una cuenta? <a href="{% url 'login' %}">Iniciar sesión</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
